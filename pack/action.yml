name: Pack the tested package
description: >
  Pack the package without running scripts, record its SHA-256, and upload it
  as an artifact for the stage action.
inputs:
  working-directory:
    description: Directory containing package.json
    default: "."
outputs:
  artifact-id:
    description: ID of the uploaded tarball artifact
    value: ${{ steps.upload.outputs.artifact-id }}
  sha256:
    description: SHA-256 of the tarball
    value: ${{ steps.pack.outputs.sha256 }}
runs:
  using: composite
  steps:
    - id: pack
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        mkdir -p "$RUNNER_TEMP/npm-release"
        npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-release"
        echo "sha256=$(sha256sum "$RUNNER_TEMP"/npm-release/*.tgz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    - id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: npm-release-${{ github.sha }}
        path: ${{ runner.temp }}/npm-release/*.tgz
        if-no-files-found: error
