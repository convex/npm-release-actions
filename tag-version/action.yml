name: Tag a new version
description: >
  If package.json's version has no v<version> tag and isn't on npm, tag the
  commit that set it and start the release workflow on that tag. Run on pushes
  to main after a checkout with fetch-depth 0. The job needs contents: write and
  actions: write.
inputs:
  working-directory:
    description: Directory containing package.json
    default: "."
  release-workflow:
    description: Workflow file to start on the new tag
    default: release.yml
  github-token:
    description: Token that can create tags and start workflows
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RELEASE_WORKFLOW: ${{ inputs.release-workflow }}
      run: |
        name=$(jq -r .name package.json)
        version=$(jq -r .version package.json)
        tag="v$version"
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "$tag already exists"
          exit 0
        fi
        if out=$(npm view "$name@$version" version 2>&1); then
          echo "$name@$version is already on npm"
          exit 0
        fi
        grep -q E404 <<<"$out" || { echo "$out" >&2; exit 1; }
        # The newest first-parent commit whose parent had another version set this one.
        for commit in $(git rev-list --first-parent HEAD -- package.json); do
          previous=$(git show "$commit^1:./package.json" 2>/dev/null | jq -r .version || true)
          [[ "$previous" == "$version" ]] || break
        done
        # Tags pushed with GITHUB_TOKEN don't trigger workflows, so start the release on the tag.
        gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$commit" >/dev/null
        gh workflow run "$RELEASE_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$tag"
        echo "Tagged $commit as $tag and started $RELEASE_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
